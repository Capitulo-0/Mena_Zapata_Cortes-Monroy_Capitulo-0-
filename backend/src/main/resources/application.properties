spring.application.name=backend

# Required process environment variables; no production credentials are stored here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=2000

# Flyway owns schema changes; Hibernate must not create or update tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

server.error.include-message=never
server.error.include-stacktrace=never

# ADC is resolved lazily; keep service-account files outside the repository.
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.check-revoked=${FIREBASE_CHECK_REVOKED:true}

# Exact browser origins, comma separated. Empty disables cross-origin browser access.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Server-side public metadata integration.
google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
